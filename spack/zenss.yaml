# AMD Zen Software Studio: AOCC compilers and AOCL libraries (BLIS for BLAS,
# libFLAME for LAPACK). OpenFOAM, STREAM and HPL all built with AOCC.
# Install AOCC first: spack install aocc +license-agreed (accepts AMD's EULA).
spack:
  specs:
  - openfoam@2506 +scotch +metis %aocc_all
  - openmpi %aocc_all
  - stream +openmp %aocc_all
  - hpl ^amdblis %aocc_all
  # %aocc alone binds AOCC to at least one language per package and lets the
  # solver pick GCC for the rest; this toolchain pins C, C++ and Fortran.
  toolchains:
    aocc_all:
    - spec: '%[virtuals=c] aocc'
      when: '%c'
    - spec: '%[virtuals=cxx] aocc'
      when: '%cxx'
    - spec: '%[virtuals=fortran] aocc'
      when: '%fortran'
  packages:
    # OpenFOAM pulls in ADIOS2, whose default XRootD backend fails to configure
    # (its http plugin needs curl, which the Spack package doesn't declare).
    # OpenFOAM needs neither XRootD nor the Catalyst plugin.
    adios2:
      require: '~xrootd ~libcatalyst'
  view: false
  concretizer:
    unify: true
